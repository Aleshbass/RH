name: CI

on:
  push:
    branches: [main]
    # Joy has its own workflow (joy.yml)
    paths-ignore: ['joy/**']
  pull_request:
    paths-ignore: ['joy/**']
  # Vercel reports each deployment to GitHub; smoke tests run after a production deploy succeeds
  deployment_status:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check and lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The generated Convex api types are large; tsc needs the headroom
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check the app (what Vercel's build checks)
        run: pnpm typecheck
      - name: Type-check Convex functions (what convex deploy checks)
        run: pnpm typecheck:convex
      - name: Lint (errors only)
        run: pnpm lint

  smoke:
    name: Production smoke tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Always the public domain: per-deployment vercel.app URLs can sit behind Vercel's login
      - run: pnpm test
        env:
          PLAYWRIGHT_BASE_URL: https://physioaroundme.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
