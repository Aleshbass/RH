name: Joy CI

# Joy (joy/backend) is the Python WhatsApp agent deployed on Railway.
on:
  push:
    branches: [main]
    paths: ['joy/**', '.github/workflows/joy.yml']
  pull_request:
    paths: ['joy/**', '.github/workflows/joy.yml']
  workflow_dispatch:

concurrency:
  group: joy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Joy backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: joy/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joy
          POSTGRES_PASSWORD: joy_ci_only
          POSTGRES_DB: joy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U joy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DISABLE_WHATSAPP_DELIVERY: 'true'
      REDIS_URL: redis://localhost:6379/0
      # conftest refuses to run unless this is set and differs from DATABASE_URL
      TEST_DATABASE_URL: postgresql+psycopg://joy:joy_ci_only@localhost:5432/joy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: joy/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to the CI database
        run: alembic upgrade heads
        env:
          DATABASE_URL: postgresql+psycopg://joy:joy_ci_only@localhost:5432/joy_test
      - run: pytest -q
