name: Joy CI

# Joy (joy/backend) is the Python WhatsApp agent deployed on Railway.
on:
  push:
    branches: [main]
    paths: ['joy/**', '.github/workflows/joy.yml']
  pull_request:
    paths: ['joy/**', '.github/workflows/joy.yml']
  workflow_dispatch:

concurrency:
  group: joy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Joy backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: joy/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joy
          POSTGRES_PASSWORD: joy_ci_only
          POSTGRES_DB: joy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U joy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      # Two isolated CI databases: conftest refuses to run when they match.
      TEST_DATABASE_URL: postgresql+psycopg://joy:joy_ci_only@127.0.0.1:5432/joy_test
      DATABASE_URL: postgresql+psycopg://joy:joy_ci_only@127.0.0.1:5432/joy_app
      REDIS_URL: redis://127.0.0.1:6379/0
      # Placeholder only: tests use a fake LLM and never call Gemini.
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      JOY_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: joy/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pytest-timeout
      - name: Create the app database
        run: PGPASSWORD=joy_ci_only psql -h 127.0.0.1 -U joy -d joy_test -c "CREATE DATABASE joy_app"
      - name: Migrate both databases
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          alembic upgrade head
      - name: Run tests
        run: python -m pytest -q --timeout=60
