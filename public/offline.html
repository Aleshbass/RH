<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1312" />
  <title>You're offline | Rehabify</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff; color: #0b1312; padding: 24px; box-sizing: border-box; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #0b1312; color: #f4f6f5; } p { color: #a9b4b2; } }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 auto; max-width: 320px; color: #4b5856; line-height: 1.5; font-size: 15px; }
    button {
      margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 600;
      background: #00cd0f; color: #0b1312; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Rehabify needs an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
