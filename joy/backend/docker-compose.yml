name: joy-local

services:
  postgres:
    image: postgres:16
    container_name: joy-local-postgres
    environment:
      POSTGRES_USER: ${JOY_POSTGRES_USER:-joy}
      POSTGRES_PASSWORD: ${JOY_POSTGRES_PASSWORD:-joy_local_only}
      POSTGRES_DB: ${JOY_POSTGRES_DB:-joy_dev}
    ports:
      - "${JOY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - joy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: joy-local-redis
    ports:
      - "${JOY_REDIS_PORT:-56379}:6379"
    volumes:
      - joy_redis_data:/data

volumes:
  joy_postgres_data:
  joy_redis_data:
